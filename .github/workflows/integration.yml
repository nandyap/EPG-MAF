name: integration
on:
  pull_request:
    paths:
      - "epg-maf/**"
      - ".github/workflows/integration.yml"
  push:
    branches: [main]

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: egp_migrator
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: egp
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: egp_migrator
      POSTGRES_PASSWORD: test-password
      POSTGRES_DATABASE: egp
      POSTGRES_SSL_MODE: disable
      EGP_TEST_POSTGRES: "1"
      LLM_API_KEY: test-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        working-directory: epg-maf
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run Alembic migrations
        working-directory: epg-maf
        run: alembic upgrade head
      - name: Seed
        working-directory: epg-maf
        run: python -m tests.support.seed
      - name: pytest -m integration
        working-directory: epg-maf
        run: python -m pytest -m integration --junitxml=integration.xml -q
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-results
          path: epg-maf/integration.xml
