name: deploy-prod
on:
  workflow_dispatch: {}
  push:
    tags:
      - "v*"

permissions:
  id-token: write   # OIDC for federated Azure login
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      LLM_API_KEY: test-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        working-directory: epg-maf
        run: pip install -e ".[dev]"
      - name: pytest
        working-directory: epg-maf
        run: python -m pytest -m "not integration and not chaos and not parity" -q

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: prod    # requires manual approval per landing-zone policy
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy Bicep
        run: |
          az deployment sub create \
            --name egp-prod-${{ github.sha }} \
            --location westeurope \
            --template-file infra/main.bicep \
            --parameters infra/env/prod.bicepparam
      - name: Smoke test
        run: |
          curl --fail --show-error https://egp.example.com/healthz
      - name: Deploy dashboards
        run: |
          for f in dashboards/*.workbook.json; do
            az monitor workbook create \
              --resource-group egp-prod-rg \
              --location westeurope \
              --workbook-file "$f" || true
          done
