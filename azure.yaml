# azd project file — EGP MAF (backend + frontend Container Apps).
#
# The Bicep template deploys INTO an existing landing zone. Before
# ``azd up``, the intake in ``docs/deployment.md`` must be complete
# and the placeholder tokens in ``infra/main.bicepparam`` must be
# populated.
#
# Docs: https://learn.microsoft.com/azure/developer/azure-developer-cli/

name: egp-maf
metadata:
  template: egp-maf@0.1.0

# azd auto-picks ``infra/main.bicep`` + ``infra/main.bicepparam``.
infra:
  provider: bicep
  path: infra

services:
  backend:
    project: ./epg-maf
    language: python
    host: containerapp
    docker:
      path: Dockerfile
      context: .
      remoteBuild: true
    # Bind this service to the Container App the Bicep template
    # provisions. The name must match ``${projectPrefix}-${env}-backend``
    # in main.bicep (currently ``egpmaf-dev-backend``).
    resourceName: egpmaf-dev-backend
  frontend:
    project: ./epg-maf/egp_frontend
    language: ts
    host: containerapp
    docker:
      path: Dockerfile
      context: .
      remoteBuild: true
      # NEXT_PUBLIC_DEV_BEARER must be baked into the client bundle at
      # build time so the browser can send it as Authorization: Bearer.
      # Set NEXT_PUBLIC_DEV_BEARER in the azd env before ``azd deploy
      # frontend`` (see docs/deployment.md).
      buildArgs:
        - NEXT_PUBLIC_DEV_BEARER
    resourceName: egpmaf-dev-frontend

hooks:
  # After Bicep provisioning, verify the ``sessions`` Cosmos container
  # exists and the backend health endpoint responds. Non-fatal on
  # failure — the runbook does deeper verification.
  postprovision:
    windows:
      shell: pwsh
      run: ./scripts/deploy_postprovision.ps1
      continueOnError: true
    posix:
      shell: sh
      run: ./scripts/deploy_postprovision.sh
      continueOnError: true
