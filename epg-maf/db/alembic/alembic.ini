# =============================================================================
# Alembic configuration for the EGP Window Postgres schema.
#
# The URL is not set here — it is resolved at runtime by env.py from the
# ALEMBIC_URL environment variable OR built from the app's Settings.
#
# Run migrations with:
#     alembic -c db/alembic/alembic.ini upgrade head
#     alembic -c db/alembic/alembic.ini downgrade base
# =============================================================================

[alembic]

# Path to the migrations tree (relative to this file).
script_location = .

# Naming template for new revisions.
file_template = %%(rev)s_%%(slug)s

# Version location(s) — where the revision Python files live.
version_locations = %(here)s/versions

# URL is populated at runtime by env.py from ALEMBIC_URL env var (or Settings).
sqlalchemy.url =


# =============================================================================
# Logging — Alembic uses Python stdlib logging. Structured logs are enabled
# in the application via structlog; here we keep Alembic's own output plain.
# =============================================================================
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
