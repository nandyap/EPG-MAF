[project]
name = "egp-maf"
version = "0.1.0"
description = "EGP Window clinical genomics decision-support agent — Microsoft Agent Framework implementation"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "Proprietary" }

dependencies = [
    # Microsoft Agent Framework (target orchestration + LLM client)
    "agent-framework>=1.0.0b1",

    # Pydantic
    "pydantic>=2.9.0,<3",
    "pydantic-settings>=2.6.0,<3",

    # Async PostgreSQL (Design ADR-020)
    "psycopg[binary,pool]>=3.2.0,<4",

    # DDL migrations (W02)
    "alembic>=1.14.0,<2",
    "sqlalchemy>=2.0.0,<3",

    # Azure Cosmos DB for NoSQL (session/thread state — Design ADR-010)
    "azure-cosmos>=4.9.0,<5",

    # Azure identity (managed identity for Postgres + Cosmos + Key Vault)
    "azure-identity>=1.19.0,<2",

    # Structured logging
    "structlog>=24.4.0,<25",

    # Env file support
    "python-dotenv>=1.0.1,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.7.0",
    "mypy>=1.11.0",
    "black>=24.10.0",
    "types-python-dateutil",

    # Seed-exporter uses DuckDB to read the prototype snapshot.
    "duckdb>=1.3.0,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/egp_maf"]

# ── Ruff ─────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "TCH", "RUF"]
ignore = [
    "E501",   # long lines handled by black; prompts may exceed
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["N802"]

[tool.ruff.format]
quote-style = "double"

# ── mypy ─────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_configs = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[[tool.mypy.overrides]]
# Third-party stubs are optional
module = ["azure.cosmos.*", "agent_framework.*", "structlog.*", "psycopg_pool.*"]
ignore_missing_imports = true

# ── pytest ───────────────────────────────────────────────────────────
[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --strict-config -p no:cacheprovider"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: fast unit tests, no external services",
    "integration: requires local Postgres + Cosmos emulator",
    "parity: byte-parity vs the LangGraph prototype",
    "slow: takes over 5 seconds",
]

[tool.coverage.run]
branch = true
source = ["src/egp_maf"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
show_missing = true
skip_covered = false
